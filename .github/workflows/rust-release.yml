name: Rust release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/rust.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: krot-rust-*
          path: release-builds
      - name: Package binaries, licenses and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_release.py --tag "$RELEASE_TAG" \
            --builds release-builds --output release-assets --notes release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file release-notes.md \
            --title "КРОТ $RELEASE_TAG"
