name: Close task
# GitHub closes an issue by `Closes #N` only for a pull request into the default branch.
# Regular pull requests go to dev, so the task is closed here.
on:
  pull_request:
    types: [closed]
    branches: [dev]
permissions:
  contents: read
jobs:
  close:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - run: |
          set -euo pipefail
          issue=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' <<<"$BODY" |
            head -n1 | grep -oE '[0-9]+' || true)
          for n in "$PR" $issue; do
            for s in ready in-review needs-fix ready-to-merge; do
              gh api -X DELETE "repos/$GH_REPO/issues/$n/labels/status:$s" --silent 2>/dev/null || true
            done
          done
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Закрыто слиянием #$PR."
          fi
