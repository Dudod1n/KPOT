name: Rust desktop
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/build_icons.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - if: runner.os == 'Linux'
        run: dbus-run-session -- cargo +stable test --locked --test tray_linux -- --ignored
      - if: runner.os == 'Linux'
        run: dbus-run-session -- cargo +stable test --locked --lib key_portal -- --ignored
      - run: cargo +stable build --release --bins --locked
      - name: Collect third-party notices
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python scripts/collect_licenses.py --target "$target" --output target/release/THIRD_PARTY_NOTICES.txt
      - if: runner.os == 'Linux'
        run: python scripts/check_rust.py -v
        env:
          KROT_RUST_BIN: target/release/krot-cli
      - if: runner.os == 'Windows'
        run: python scripts/check_rust.py -v
        env:
          KROT_RUST_BIN: target/release/krot-cli.exe
      - uses: actions/upload-artifact@v7
        with:
          name: krot-rust-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/krot
            target/release/krot.exe
            target/release/krot-cli
            target/release/krot-cli.exe
            target/release/THIRD_PARTY_NOTICES.txt
