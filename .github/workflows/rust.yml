name: Rust desktop
on:
  push:
    branches: ['**']
  # Pushes already run CI on every branch of this repository. A pull request runs it again
  # only into main, where the merge result is checked and its build can be tested, and
  # from forks, whose pushes never run here. See the condition on the relay job.
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A new push to a working branch or pull request cancels the run for the previous one.
# Runs on dev and main, which save the cache, and on tags, which includes the release build
# called from rust-release.yml with the caller's context, each get a group of their own:
# a shared group would also cancel a queued run, not only a running one.
concurrency:
  group: >-
    rust-desktop-${{ (startsWith(github.ref, 'refs/tags/')
    || github.ref == 'refs/heads/dev'
    || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    # The server UDP relay: static Linux builds that the client embeds.
    # `rust` needs this job, so the condition skips the whole run.
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'main'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from rust-toolchain.toml.
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustc -V
      # Every run restores the dependency cache except a release built from a tag, which starts
      # from nothing; only dev and main save it.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: relay
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      # aarch64 tests run under qemu-user registered with binfmt_misc, so the kernel starts
      # aarch64 binaries, cargo's tests and the relay they spawn, through the emulator without
      # a runner. The F flag keeps the emulator loaded after the installer's container exits.
      # The image is pinned by digest (tonistiigi/binfmt:qemu-v10.2.3-68).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Check the aarch64 emulator
        run: |
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -Eq '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
      - run: cargo test --locked -p krot-udp-proto -p krot-relay --target x86_64-unknown-linux-musl
      - run: cargo test --locked -p krot-udp-proto -p krot-relay --target aarch64-unknown-linux-musl
      - name: Build the relay for both architectures
        run: |
          mkdir relay-bin
          for arch in x86_64 aarch64; do
            cargo build --locked -p krot-relay --profile relay --target "$arch-unknown-linux-musl"
            cp "target/$arch-unknown-linux-musl/relay/krot-relay" "relay-bin/krot-relay-$arch"
          done
          sha256sum relay-bin/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krot-relay
          path: relay-bin/
          if-no-files-found: error
  rust:
    needs: relay
    env:
      KROT_RELAY_DIR: ${{ github.workspace }}/relay-bin
      KROT_REQUIRE_RELAY: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krot-relay
          path: relay-bin
      # The version and components come from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustc -V
      # Every run restores the dependency cache except a release built from a tag, which starts
      # from nothing; only dev and main save it.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all --check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/build_icons.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The hosted runner is an administrator and loads the signed driver, so the capture path
      # runs against the real WinDivert. Its files go next to the actual test binary, which
      # cargo places by its own layout.
      - if: runner.os == 'Windows'
        name: Test capture with the WinDivert driver
        shell: bash
        run: |
          dir=$(cargo test --locked --lib --no-run --message-format=json \
            | python -X utf8 -c "import sys, json, os; print(next(os.path.dirname(m['executable']) for m in map(json.loads, sys.stdin) if m.get('executable')))")
          echo "test binary directory: $dir"
          python scripts/fetch_windivert.py --output "$dir"
          cargo test --locked --lib windivert_captures -- --ignored --nocapture
      - if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test --locked --test tray_linux -- --ignored
      - if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test --locked --lib key_portal -- --ignored
      - run: cargo build --release --bins --locked
      - name: Collect third-party notices
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python scripts/collect_licenses.py --target "$target" --output target/release/THIRD_PARTY_NOTICES.txt
      - if: runner.os == 'Linux'
        run: python scripts/check_rust.py -v
        env:
          KROT_RUST_BIN: target/release/krot-cli
      - if: runner.os == 'Windows'
        run: python scripts/check_rust.py -v
        env:
          KROT_RUST_BIN: target/release/krot-cli.exe
      - if: runner.os == 'Windows'
        name: Fetch the pinned WinDivert files
        run: python scripts/fetch_windivert.py --output target/release
      # Authenticode signing (#93) goes here once a certificate exists: krot.exe and
      # krot-cli.exe before the installer is built, the installer right after it, all before
      # the artifact is uploaded and SHA256SUMS is computed. No certificate is used yet.
      - if: runner.os == 'Windows'
        name: Build the installer
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/wix" wix --version 5.0.2
          "$RUNNER_TEMP/wix/wix.exe" extension add -g WixToolset.UI.wixext/5.0.2
          python scripts/build_msi.py --binaries target/release --wix "$RUNNER_TEMP/wix/wix.exe"
          # The same binaries under a higher version, only to check an upgrade below.
          python scripts/build_msi.py --binaries target/release --wix "$RUNNER_TEMP/wix/wix.exe" \
            --version 255.0.0 --output "$RUNNER_TEMP/krot-upgrade.msi"
      # The hosted runner is a disposable administrator: the package is installed, used,
      # upgraded and removed on it for real.
      - if: runner.os == 'Windows'
        name: Install, upgrade and remove the installer
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          python -X utf8 scripts/check_installer.py --package "target/release/krot-$version-windows-x64.msi" \
            --version "$version" --upgrade "$RUNNER_TEMP/krot-upgrade.msi" --upgrade-version 255.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krot-rust-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/krot
            target/release/krot.exe
            target/release/krot-cli
            target/release/krot-cli.exe
            target/release/THIRD_PARTY_NOTICES.txt
            target/release/WinDivert.dll
            target/release/WinDivert64.sys
            target/release/WinDivert-LICENSE.txt
            target/release/krot-*-windows-x64.msi
